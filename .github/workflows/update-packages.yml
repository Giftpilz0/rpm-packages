---
name: Update Package Versions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Make update script executable
        run: chmod +x update.sh

      - name: Run update script
        run: ./update.sh

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in the repository"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Generate package list
        id: changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add SPECS/*/*.spec

          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No spec files changed"
            echo "packages=" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_PACKAGES=$(git diff --cached --name-only | sed 's|SPECS/||' | sed 's|/[^/]*$||' | sort -u | paste -sd ',' -)
          echo "packages=$CHANGED_PACKAGES" >> $GITHUB_OUTPUT
          echo "Changes: $CHANGED_PACKAGES"

      - name: Create Pull Request
        id: create-pr
        if: steps.verify-changed-files.outputs.changed == 'true' && steps.changes.outputs.packages != ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(deps): update package versions

            Updated packages:
            ${{ steps.changes.outputs.packages }}

            Auto-generated by package update workflow
          title: "chore(deps): update package versions"
          body: |
            Automated package version updates.

            Updated packages:
            ${{ steps.changes.outputs.packages }}
          branch: update-packages-${{ github.run_id }}
          delete-branch: true
          labels: "dependencies,automated"

      - name: Install GitHub CLI
        if: steps.create-pr.outputs.pull-request-number != '0'
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh

      - name: Merge PR
        if: steps.create-pr.outputs.pull-request-number != '0'
        run: |
          gh pr merge "${{ steps.create-pr.outputs.pull-request-number }}" --merge --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
