name: Selective COPR Builds & Updates

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Run a full rebuild of all packages"
        required: false
        type: boolean
        default: false
      update_specs:
        description: "Run package version update script"
        required: false
        type: boolean
        default: false

jobs:
  update-packages:
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event.inputs.full_rebuild == 'true' || github.event.inputs.update_specs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed_packages: ${{ steps.changes.outputs.changed_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Make update script executable
        run: chmod +x update.sh

      - name: Run update script
        run: ./update.sh

      - name: Detect changed packages
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            CHANGED=$(git diff --name-only | grep '^SPECS/' | sed 's|SPECS/||' | cut -d'/' -f1 | sort -u | paste -sd ',' -)
            echo "changed_packages=$CHANGED" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed_packages=" >> $GITHUB_OUTPUT
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add SPECS/*/*.spec

          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No spec files changed"
            exit 0
          fi

          CHANGED_PACKAGES=$(git diff --cached --name-only | sed 's|SPECS/||' | sed 's|/[^/]*$||' | sort -u | paste -sd ',' -)
          git commit -m "chore(deps): update package versions

          Updated packages: $CHANGED_PACKAGES

          Auto-generated by package update workflow"

          git push

  detect-changes:
    needs: update-packages
    runs-on: ubuntu-latest
    if: needs.update-packages.outputs.changed_packages != ''
    outputs:
      breakpad: ${{ steps.changes.outputs.breakpad }}
      matugen-git: ${{ steps.changes.outputs.matugen-git }}
      niri-git: ${{ steps.changes.outputs.niri-git }}
      quickshell-git: ${{ steps.changes.outputs.quickshell-git }}
      waypipe-git: ${{ steps.changes.outputs.waypipe-git }}
      yolk-git: ${{ steps.changes.outputs.yolk-git }}
      eww-git: ${{ steps.changes.outputs.eww-git }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse changed packages
        id: changes
        run: |
          CHANGED_LIST="${{ needs.update-packages.outputs.changed_packages }}"
          echo "breakpad=false" >> $GITHUB_OUTPUT
          echo "eww-git=false" >> $GITHUB_OUTPUT
          echo "matugen-git=false" >> $GITHUB_OUTPUT
          echo "niri-git=false" >> $GITHUB_OUTPUT
          echo "quickshell-git=false" >> $GITHUB_OUTPUT
          echo "waypipe-git=false" >> $GITHUB_OUTPUT
          echo "yolk-git=false" >> $GITHUB_OUTPUT

          if [[ "$CHANGED_LIST" == *"breakpad"* ]]; then
            echo "breakpad=true" >> $GITHUB_OUTPUT
          fi
          if [[ "$CHANGED_LIST" == *"eww-git"* ]]; then
            echo "eww-git=true" >> $GITHUB_OUTPUT
          fi
          if [[ "$CHANGED_LIST" == *"matugen-git"* ]]; then
            echo "matugen-git=true" >> $GITHUB_OUTPUT
          fi
          if [[ "$CHANGED_LIST" == *"niri-git"* ]]; then
            echo "niri-git=true" >> $GITHUB_OUTPUT
          fi
          if [[ "$CHANGED_LIST" == *"quickshell-git"* ]]; then
            echo "quickshell-git=true" >> $GITHUB_OUTPUT
          fi
          if [[ "$CHANGED_LIST" == *"waypipe-git"* ]]; then
            echo "waypipe-git=true" >> $GITHUB_OUTPUT
          fi
          if [[ "$CHANGED_LIST" == *"yolk-git"* ]]; then
            echo "yolk-git=true" >> $GITHUB_OUTPUT
          fi

  build-breakpad:
    needs: detect-changes
    if: >-
      (needs.detect-changes.outputs.breakpad == 'true') ||
      (github.event.inputs.full_rebuild == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger breakpad COPR build
        run: |
          curl -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_WEBHOOK_ID }}/${{ secrets.COPR_WEBHOOK_UUID }}/breakpad/"

  build-eww-git:
    needs: detect-changes
    if: >-
      (needs.detect-changes.outputs.eww-git == 'true') ||
      (github.event.inputs.full_rebuild == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger eww-git COPR build
        run: |
          curl -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_WEBHOOK_ID }}/${{ secrets.COPR_WEBHOOK_UUID }}/eww-git/"

  build-matugen-git:
    needs: detect-changes
    if: >-
      (needs.detect-changes.outputs.matugen-git == 'true') ||
      (github.event.inputs.full_rebuild == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger matugen-git COPR build
        run: |
          curl -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_WEBHOOK_ID }}/${{ secrets.COPR_WEBHOOK_UUID }}/matugen-git/"

  build-niri-git:
    needs: detect-changes
    if: >-
      (needs.detect-changes.outputs.niri-git == 'true') ||
      (github.event.inputs.full_rebuild == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger niri-git COPR build
        run: |
          curl -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_WEBHOOK_ID }}/${{ secrets.COPR_WEBHOOK_UUID }}/niri-git/"

  build-quickshell-git:
    needs: detect-changes
    if: >-
      (needs.detect-changes.outputs.quickshell-git == 'true') ||
      (github.event.inputs.full_rebuild == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger quickshell-git COPR build
        run: |
          curl -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_WEBHOOK_ID }}/${{ secrets.COPR_WEBHOOK_UUID }}/quickshell-git/"

  build-waypipe-git:
    needs: detect-changes
    if: >-
      (needs.detect-changes.outputs.waypipe-git == 'true') ||
      (github.event.inputs.full_rebuild == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger waypipe-git COPR build
        run: |
          curl -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_WEBHOOK_ID }}/${{ secrets.COPR_WEBHOOK_UUID }}/waypipe-git/"

  build-yolk-git:
    needs: detect-changes
    if: >-
      (needs.detect-changes.outputs.yolk-git == 'true') ||
      (github.event.inputs.full_rebuild == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger yolk-git COPR build
        run: |
          curl -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_WEBHOOK_ID }}/${{ secrets.COPR_WEBHOOK_UUID }}/yolk-git/"
