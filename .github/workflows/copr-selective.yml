---
name: Selective COPR Builds

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Run a full rebuild of all packages"
        required: false
        type: boolean
        default: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      breakpad: ${{ steps.changes.outputs.breakpad }}
      matugen-git: ${{ steps.changes.outputs.matugen-git }}
      niri-git: ${{ steps.changes.outputs.niri-git }}
      quickshell-git: ${{ steps.changes.outputs.quickshell-git }}
      waypipe-git: ${{ steps.changes.outputs.waypipe-git }}
      yolk-git: ${{ steps.changes.outputs.yolk-git }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            breakpad:
              - 'SPECS/breakpad/**'
            eww-git:
              - 'SPECS/eww-git/**'
            matugen-git:
              - 'SPECS/matugen-git/**'
            niri-git:
              - 'SPECS/niri-git/**'
            quickshell-git:
              - 'SPECS/quickshell-git/**'
            waypipe-git:
              - 'SPECS/waypipe-git/**'
            yolk-git:
              - 'SPECS/yolk-git/**'

  build-breakpad:
    needs: detect-changes
    if: needs.detect-changes.outputs.breakpad == 'true' || github.event.inputs.full_rebuild == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger breakpad COPR build
        run: |
          curl -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_WEBHOOK_ID }}/${{ secrets.COPR_WEBHOOK_UUID }}/breakpad/"

  build-eww-git:
    needs: detect-changes
    if: needs.detect-changes.outputs.eww-git == 'true' || github.event.inputs.full_rebuild == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger eww-git COPR build
        run: |
          curl -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_WEBHOOK_ID }}/${{ secrets.COPR_WEBHOOK_UUID }}/eww-git/"

  build-matugen-git:
    needs: detect-changes
    if: needs.detect-changes.outputs.matugen-git == 'true' || github.event.inputs.full_rebuild == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger matugen-git COPR build
        run: |
          curl -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_WEBHOOK_ID }}/${{ secrets.COPR_WEBHOOK_UUID }}/matugen-git/"

  build-niri-git:
    needs: detect-changes
    if: needs.detect-changes.outputs.niri-git == 'true' || github.event.inputs.full_rebuild == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger niri-git COPR build
        run: |
          curl -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_WEBHOOK_ID }}/${{ secrets.COPR_WEBHOOK_UUID }}/niri-git/"

  build-quickshell-git:
    needs: detect-changes
    if: needs.detect-changes.outputs.quickshell-git == 'true' || github.event.inputs.full_rebuild == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger quickshell-git COPR build
        run: |
          curl -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_WEBHOOK_ID }}/${{ secrets.COPR_WEBHOOK_UUID }}/quickshell-git/"

  build-waypipe-git:
    needs: detect-changes
    if: needs.detect-changes.outputs.waypipe-git == 'true' || github.event.inputs.full_rebuild == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger waypipe-git COPR build
        run: |
          curl -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_WEBHOOK_ID }}/${{ secrets.COPR_WEBHOOK_UUID }}/waypipe-git/"

  build-yolk-git:
    needs: detect-changes
    if: needs.detect-changes.outputs.yolk-git == 'true' || github.event.inputs.full_rebuild == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger yolk-git COPR build
        run: |
          curl -X POST \
            "https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_WEBHOOK_ID }}/${{ secrets.COPR_WEBHOOK_UUID }}/yolk-git/"
